# FinEquity — the FINDYN_V1_SPEC.md model stack (Phase 3).
#
# Sub-milestone A (spec M2) has landed: role resolution and the causal feature
# path. The engine is enabled because it publishes real features on every run;
# it does not yet publish an AssetState, because that needs the regime model
# from sub-milestone B and a placeholder regime would be fiction on a dashboard.
#
# Its price series live in series.yaml under engines.equity.series, named by
# where the data comes from. findynamics/engines/equity/prices.py is the only
# place those names become the engine's own (publication / calibration /
# deep_history), and the resolution is stamped into model_version.
enabled: true

prices:
  # Below this many knowable observations a configured role does not count as
  # present. A half-finished backfill is not a training set, and letting one win
  # the calibration precedence would move the training window silently — which
  # is the failure the fixed precedence exists to prevent.
  min_observations: 250

features:
  # Fractional differentiation (§8.2). `d` is searched on the training window
  # and frozen PER SERIES: the publication series holds ten years and the
  # calibration series forty, and their minimum stationary `d` has no reason to
  # be the same number. One shared `d` is a silent error, not a simplification.
  ffd_threshold: 1.0e-5
  # ADF at 95% confidence, as the spec specifies.
  ffd_significance: 0.05
  # How far back one FFD value is allowed to remember. The threshold alone does
  # not bound the window usefully — at d=0.3 the weights need ~2,300 lags to fall
  # under 1e-5, which is wider than the whole publication series and would leave
  # a couple of hundred usable rows and no 12-month momentum. In years, so the
  # same number means one year on the daily paths and one year on the monthly
  # deep history rather than 252 lags on both.
  ffd_max_memory_years: 1.0

  # Expanding-window baseline for the jerk z-score (§8.3 asks for ten years).
  # FRED:SP500 is licence-capped to roughly ten years in total, so the baseline
  # degrades to half the available history rather than emitting a column of NaN;
  # when it does, the state says so (`jerk_baseline_is_short`).
  z_min_years: 10.0

  # Momentum windows in months (§2.1's 21/63/252 trading days). Months rather
  # than observations so the same numbers mean the same spans on the daily paths
  # and on the monthly deep history.
  momentum_months: [1, 3, 12]

  # MLE iteration cap for the local linear trend variances. Raising it does not
  # help on an index price: the likelihood is nearly flat in the trend variance,
  # so the optimizer stops at a boundary solution after ~20 iterations whatever
  # the cap. That solution is stable and its filtered path is the one used; the
  # non-convergence is recorded as a diagnostic rather than treated as a failure.
  kalman_maxiter: 200

# The regime model (§9 L2/L3). Fitted on the calibration series and applied to
# the publication series — see findynamics/engines/equity/regime/design.py for
# why that transfer is sound and tests/engines/equity/test_transfer.py for the
# evidence.
regime:
  # Windows for the dimensionless design matrix, in the units named.
  # Two trend horizons, because a fast crash and a slow bear are different
  # events and one window cannot see both: a quarter sees 1987 and 2020, a year
  # sees 2000 and 2008. Neither is the Kalman slope — see regime/design.py for
  # why the obvious choice put a rising market at all-time highs into `bear`.
  trend_fast_months: 3.0
  trend_slow_months: 12.0
  vol_months: 1.0
  vol_baseline_years: 3.0
  drawdown_years: 1.0

  # Dirichlet pseudo-counts on the transition-matrix diagonal, quoted for a
  # daily series and scaled to the actual frequency. Not a smoothing hack: it
  # encodes "market regimes last months". Without it the fit produced a median
  # regime duration of ONE DAY and 3,029 regime changes in 39 years, which is a
  # volatility classifier wearing a regime model's vocabulary.
  transition_prior: 1000.0

  # Fixed so a refit on the same data lands in the same place; the replay test
  # depends on it. Changing this is a model change, not a tuning knob.
  seed: 20260731

  # §9 L3 — horizons the transition probability is published for, in months.
  horizons: [3, 6, 12]

outputs:
  # TWO WINDOWS, AND THEY GOVERN DIFFERENT RUNS.
  #
  # history_days is the NIGHTLY window: how far back `jobs.daily` republishes
  # its per-date series. Short on purpose — everything older is an unchanged
  # upsert, so a long nightly window writes a century every night to add one
  # row. Upserts are idempotent, so this costs write time, never accuracy.
  history_days: 1825
  #
  # backfill_history_days is the BACKFILL window, used only by
  # `jobs.daily --full-history`. It reaches past 1927-12-30, the start of the
  # daily S&P record, so one deliberate run puts the whole history in D1 and
  # `/equity` can chart it. Running this nightly is the mistake the split
  # exists to prevent.
  backfill_history_days: 40000

# §3.2 / §4 — the instability index and the crash decomposition.
instability:
  # Peaks-over-threshold cut for the 1871+ tail. Deep enough to be a real
  # drawdown, shallow enough that a century of monthly data holds ~46 episodes.
  tail_threshold: 0.10
  # Horizon the published crash decomposition is quoted over.
  crash_horizon_months: 12
  # Component weights (§3.2 default: equal). Read the open-issues note before
  # tuning these — as specified, three of the seven components move against the
  # other four during a crisis, so reweighting changes what the index measures
  # rather than merely how loudly it says it.
  # weights: {posterior_entropy: 1.0, ...}

# §11 — the Monte Carlo.
simulate:
  # Paths per horizon. The spec's floor is 10,000; set to 0 to skip the
  # simulation entirely, which is how a replay across many cutoffs avoids
  # paying for it.
  paths: 10000
  seed: 20260731
