# FinDynamics — series map and point-in-time publication lags
# Source of truth: FINDYN_V1_SPEC.md §5.2.
#
# Three blocks: `meta`, the shared `factors` (Layer 0, owned by no engine) and
# `engines.<name>.series` for engine-private series. Per-engine enable flags and
# parameters live in config/engines/<name>.yaml.
#
# publication_lag_days is the CONSERVATIVE fallback used to synthesise a
# release_date when the source exposes no vintage (§5.2, §14.1). Where ALFRED
# vintages exist, the real vintage wins and this value is ignored.
# Extend this file to add series — never hard-code a series id in Python.

meta:
  spec_version: "1.0"
  # Information-set convention applied everywhere (§14.1 rule 1).
  info_set: "t-1"
  # Deep-history backbone starts here (Shiller monthly).
  history_start: "1871-01-01"

# ---------------------------------------------------------------------------
# Shared risk factors — §2.2 (v1 called them "forces"). Each factor is a 0-100
# percentile score built from the constituent series below (§8 step 4).
# Global: computed once per run and handed to every engine via WorldState.
# ---------------------------------------------------------------------------
factors:
  valuation:
    weight: 1.0
    series:
      - {id: "SHILLER:CAPE", provider: shiller, frequency: monthly, publication_lag_days: 30, direction: -1}
      # Excess CAPE yield = 1/CAPE - 10y real rate; derived, not fetched.
      - {id: "DERIVED:EXCESS_CAPE_YIELD", provider: derived, frequency: monthly, publication_lag_days: 30, direction: 1}

  earnings:
    weight: 1.0
    series:
      - {id: "SHILLER:REAL_EPS", provider: shiller, frequency: monthly, publication_lag_days: 30, direction: 1}
      - {id: "BEA:CORPORATE_PROFITS", provider: bea, frequency: quarterly, publication_lag_days: 60, direction: 1}

  liquidity:
    weight: 1.0
    series:
      - {id: "FRED:M2SL", provider: fred, frequency: monthly, publication_lag_days: 14, direction: 1}
      - {id: "FRED:WALCL", provider: fred, frequency: weekly, publication_lag_days: 7, direction: 1}
      - {id: "FRED:RRPONTSYD", provider: fred, frequency: daily, publication_lag_days: 1, direction: -1}
      - {id: "FRED:NFCI", provider: fred, frequency: weekly, publication_lag_days: 7, direction: -1}

  rates:
    weight: 1.0
    series:
      - {id: "FRED:DGS2", provider: fred, frequency: daily, publication_lag_days: 1, direction: -1}
      - {id: "FRED:DGS10", provider: fred, frequency: daily, publication_lag_days: 1, direction: -1}
      - {id: "FRED:DFII10", provider: fred, frequency: daily, publication_lag_days: 1, direction: -1}
      - {id: "FRED:T10Y2Y", provider: fred, frequency: daily, publication_lag_days: 1, direction: 1}
      - {id: "FRED:T10Y3M", provider: fred, frequency: daily, publication_lag_days: 1, direction: 1}

  credit:
    weight: 1.0
    series:
      - {id: "FRED:BAMLH0A0HYM2", provider: fred, frequency: daily, publication_lag_days: 1, direction: -1}
      - {id: "FRED:BAMLC0A0CM", provider: fred, frequency: daily, publication_lag_days: 1, direction: -1}
      - {id: "FRED:BUSLOANS", provider: fred, frequency: weekly, publication_lag_days: 7, direction: 1}
      - {id: "FRED:DRTSCILM", provider: fred, frequency: quarterly, publication_lag_days: 45, direction: -1}

  inflation:
    weight: 1.0
    series:
      - {id: "FRED:CPIAUCSL", provider: fred, frequency: monthly, publication_lag_days: 14, direction: -1}
      - {id: "FRED:CPILFESL", provider: fred, frequency: monthly, publication_lag_days: 14, direction: -1}
      - {id: "FRED:T5YIFR", provider: fred, frequency: daily, publication_lag_days: 1, direction: -1}

  labor:
    weight: 1.0
    series:
      - {id: "FRED:UNRATE", provider: fred, frequency: monthly, publication_lag_days: 7, direction: -1}
      - {id: "FRED:PAYEMS", provider: fred, frequency: monthly, publication_lag_days: 7, direction: 1}
      - {id: "FRED:ICSA", provider: fred, frequency: weekly, publication_lag_days: 5, direction: -1}
      - {id: "BLS:CES0500000003", provider: bls, frequency: monthly, publication_lag_days: 7, direction: 1}

  risk_appetite:
    weight: 1.0
    series:
      - {id: "FRED:VIXCLS", provider: fred, frequency: daily, publication_lag_days: 1, direction: -1}
      - {id: "FRED:STLFSI4", provider: fred, frequency: weekly, publication_lag_days: 7, direction: -1}
      # HY - IG spread differential; derived from the credit series above.
      - {id: "DERIVED:HY_IG_DIFFERENTIAL", provider: derived, frequency: daily, publication_lag_days: 1, direction: -1}

  sentiment:
    weight: 1.0
    series:
      - {id: "FRED:UMCSENT", provider: fred, frequency: monthly, publication_lag_days: 14, direction: 1}

  # Every factor score is on one axis: 100 = maximally risk-supportive. The two
  # below therefore read "high score = low real rates" and "high score = weak
  # dollar"; `direction` is what orients each series onto that axis. Consumers
  # wanting the level itself read FactorState.components, which carries it.
  real_rate:
    weight: 1.0
    series:
      # 10y real rate = nominal - breakeven. Encoded as its two legs with
      # opposing directions rather than as a DERIVED series, so the same scoring
      # pipeline handles it and no series needs computing before ingestion.
      - {id: "FRED:DGS10", provider: fred, frequency: daily, publication_lag_days: 1, direction: -1}
      - {id: "FRED:T10YIE", provider: fred, frequency: daily, publication_lag_days: 1, direction: 1}

  usd_strength:
    weight: 1.0
    series:
      # Broad nominal trade-weighted dollar. A stronger dollar tightens global
      # financial conditions, hence direction -1 on the supportive axis.
      - {id: "FRED:DTWEXBGS", provider: fred, frequency: daily, publication_lag_days: 1, direction: -1}

# ---------------------------------------------------------------------------
# Engine-private series. Nothing here is shared: another engine that needs one
# of these promotes it into `factors` rather than reaching across the boundary.
# ---------------------------------------------------------------------------
engines:
  money:
    # The numeraire's inputs. Roles are semantic — engines/money reads
    # `short_rate_primary`, not a hard-coded series id — so re-pointing the short
    # rate at a different series is a yaml edit.
    #
    # DGS3MO and RRPONTSYD are already ingested (by the rates engine and the
    # liquidity factor respectively). Naming them again here costs nothing: every
    # loader de-duplicates by series id (`required_series_ids`, `resolve_specs`,
    # `configured_series` are all set-based), so the rows are fetched once and
    # stored once. What this block declares is *which role each id plays for this
    # engine*, which is not derivable from the fact that someone else wants it.
    series:
      # SOFR from 2018-04-03; the fallback carries the path before that.
      short_rate_primary:  {id: "FRED:SOFR",      provider: fred, frequency: daily, publication_lag_days: 1}
      # 3m bill, secondary market, DISCOUNT basis — converted to an investment
      # yield in account.py before it enters the accrual (see its docstring).
      short_rate_fallback: {id: "FRED:DTB3",      provider: fred, frequency: daily, publication_lag_days: 1}
      # Constant-maturity 3m bill: already an investment yield, so this is the leg
      # that is directly comparable with SOFR in the bill-SOFR spread.
      bill_3m:             {id: "FRED:DGS3MO",    provider: fred, frequency: daily, publication_lag_days: 1}
      # Overnight reverse repo take-up, in $bn — the drainable liquidity buffer.
      rrp_volume:          {id: "FRED:RRPONTSYD", provider: fred, frequency: daily, publication_lag_days: 1}

      # FinRates' fitted curve, read back as data rather than imported as code
      # (§3 rule 2). The `engine_output` provider fetches these from the serving
      # plane's own /assets/rates/history endpoint, so they arrive through
      # pit_join like any other observation and carry a real release date. Absent
      # them — first run ever, or the API unreachable — money still publishes and
      # discounts long horizons off the flat short rate instead.
      ns_level:     {id: "ENGINE:rates.ns_level",     provider: engine_output, frequency: daily, publication_lag_days: 0}
      ns_slope:     {id: "ENGINE:rates.ns_slope",     provider: engine_output, frequency: daily, publication_lag_days: 0}
      ns_curvature: {id: "ENGINE:rates.ns_curvature", provider: engine_output, frequency: daily, publication_lag_days: 0}
      # The frozen shape parameter. Without it the published betas cannot be
      # turned back into a curve, so it is published per date and read per date.
      ns_lambda:    {id: "ENGINE:rates.ns_lambda",    provider: engine_output, frequency: daily, publication_lag_days: 0}

  rates:
    # The observable US Treasury constant-maturity curve. Every tenor is its own
    # series; which of them exist on a given day varies (holidays, and DGS1MO
    # only starts in 2001), so curve.py fits whatever is present rather than
    # requiring the full set. The tenor each id represents, in years, is in
    # config/engines/rates.yaml — this file stays a pure series map.
    series:
      dgs1mo:  {id: "FRED:DGS1MO", provider: fred, frequency: daily, publication_lag_days: 1}
      dgs3mo:  {id: "FRED:DGS3MO", provider: fred, frequency: daily, publication_lag_days: 1}
      dgs6mo:  {id: "FRED:DGS6MO", provider: fred, frequency: daily, publication_lag_days: 1}
      dgs1:    {id: "FRED:DGS1",   provider: fred, frequency: daily, publication_lag_days: 1}
      dgs2:    {id: "FRED:DGS2",   provider: fred, frequency: daily, publication_lag_days: 1}
      dgs3:    {id: "FRED:DGS3",   provider: fred, frequency: daily, publication_lag_days: 1}
      dgs5:    {id: "FRED:DGS5",   provider: fred, frequency: daily, publication_lag_days: 1}
      dgs7:    {id: "FRED:DGS7",   provider: fred, frequency: daily, publication_lag_days: 1}
      dgs10:   {id: "FRED:DGS10",  provider: fred, frequency: daily, publication_lag_days: 1}
      dgs20:   {id: "FRED:DGS20",  provider: fred, frequency: daily, publication_lag_days: 1}
      dgs30:   {id: "FRED:DGS30",  provider: fred, frequency: daily, publication_lag_days: 1}
      # 10y breakeven inflation — not a curve point; used for the real-rate read.
      breakeven10: {id: "FRED:T10YIE", provider: fred, frequency: daily, publication_lag_days: 1}

  equity:
    # The S&P500 price backbone — FinEquity's private input (FINDYN_V1_SPEC.md).
    series:
      # Daily incremental updates. Free tier is 25 requests/day — daily only, never backfill.
      primary:
        provider: alphavantage
        symbol: SPY
        frequency: daily
        publication_lag_days: 0
      # Bulk daily history for backfill (free, no key).
      backfill:
        provider: stooq
        symbol: "^spx"
        frequency: daily
        publication_lag_days: 0
      # Deep monthly history, 1871+.
      deep_history:
        provider: shiller
        field: real_price
        frequency: monthly
        publication_lag_days: 30
      fallback:
        # Unofficial and unstable — isolated adapter, deletable without touching callers (§5.1).
        provider: yahoo
        symbol: "^GSPC"
        frequency: daily
        publication_lag_days: 0

# Cached in KV with a short TTL for the dashboard's live tiles (§6).
realtime_cache:
  ttl_seconds: 900
  series: ["FRED:VIXCLS", "FRED:DGS10", "PRICE:SPY"]
