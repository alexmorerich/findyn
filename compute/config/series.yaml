# FinDynamics — series map and point-in-time publication lags
# Source of truth: FINDYN_V1_SPEC.md §5.2.
#
# Three blocks: `meta`, the shared `factors` (Layer 0, owned by no engine) and
# `engines.<name>.series` for engine-private series. Per-engine enable flags and
# parameters live in config/engines/<name>.yaml.
#
# publication_lag_days is the CONSERVATIVE fallback used to synthesise a
# release_date when the source exposes no vintage (§5.2, §14.1). Where ALFRED
# vintages exist, the real vintage wins and this value is ignored.
# Extend this file to add series — never hard-code a series id in Python.

meta:
  spec_version: "1.0"
  # Information-set convention applied everywhere (§14.1 rule 1).
  info_set: "t-1"
  # Deep-history backbone starts here (Shiller monthly).
  history_start: "1871-01-01"

# ---------------------------------------------------------------------------
# Shared risk factors — §2.2 (v1 called them "forces"). Each factor is a 0-100
# percentile score built from the constituent series below (§8 step 4).
# Global: computed once per run and handed to every engine via WorldState.
# ---------------------------------------------------------------------------
factors:
  valuation:
    weight: 1.0
    series:
      - {id: "SHILLER:CAPE", provider: shiller, frequency: monthly, publication_lag_days: 30, direction: -1}
      # Excess CAPE yield = 1/CAPE - 10y real rate; derived, not fetched.
      - {id: "DERIVED:EXCESS_CAPE_YIELD", provider: derived, frequency: monthly, publication_lag_days: 30, direction: 1}

  earnings:
    weight: 1.0
    series:
      - {id: "SHILLER:REAL_EPS", provider: shiller, frequency: monthly, publication_lag_days: 30, direction: 1}
      # NEEDS BEA_API_KEY. Unset in production as of 2026-08-08, so this factor
      # publishes from Shiller alone — one of its two inputs, at a score that
      # looks exactly as confident as a complete one. The count now travels with
      # it (`inputs_used` / `inputs_configured` in the published components), so
      # the gap is visible rather than inferred; setting the key is what closes
      # it. Free from https://apps.bea.gov/API/signup/.
      - {id: "BEA:CORPORATE_PROFITS", provider: bea, frequency: quarterly, publication_lag_days: 60, direction: 1}

  liquidity:
    weight: 1.0
    series:
      - {id: "FRED:M2SL", provider: fred, frequency: monthly, publication_lag_days: 14, direction: 1}
      - {id: "FRED:WALCL", provider: fred, frequency: weekly, publication_lag_days: 7, direction: 1}
      - {id: "FRED:RRPONTSYD", provider: fred, frequency: daily, publication_lag_days: 1, direction: -1}
      - {id: "FRED:NFCI", provider: fred, frequency: weekly, publication_lag_days: 7, direction: -1}

  rates:
    weight: 1.0
    series:
      - {id: "FRED:DGS2", provider: fred, frequency: daily, publication_lag_days: 1, direction: -1}
      - {id: "FRED:DGS10", provider: fred, frequency: daily, publication_lag_days: 1, direction: -1}
      - {id: "FRED:DFII10", provider: fred, frequency: daily, publication_lag_days: 1, direction: -1}
      - {id: "FRED:T10Y2Y", provider: fred, frequency: daily, publication_lag_days: 1, direction: 1}
      - {id: "FRED:T10Y3M", provider: fred, frequency: daily, publication_lag_days: 1, direction: 1}

  credit:
    weight: 1.0
    series:
      - {id: "FRED:BAMLH0A0HYM2", provider: fred, frequency: daily, publication_lag_days: 1, direction: -1}
      - {id: "FRED:BAMLC0A0CM", provider: fred, frequency: daily, publication_lag_days: 1, direction: -1}
      - {id: "FRED:BUSLOANS", provider: fred, frequency: weekly, publication_lag_days: 7, direction: 1}
      - {id: "FRED:DRTSCILM", provider: fred, frequency: quarterly, publication_lag_days: 45, direction: -1}

  inflation:
    weight: 1.0
    series:
      - {id: "FRED:CPIAUCSL", provider: fred, frequency: monthly, publication_lag_days: 14, direction: -1}
      - {id: "FRED:CPILFESL", provider: fred, frequency: monthly, publication_lag_days: 14, direction: -1}
      - {id: "FRED:T5YIFR", provider: fred, frequency: daily, publication_lag_days: 1, direction: -1}

  labor:
    weight: 1.0
    series:
      - {id: "FRED:UNRATE", provider: fred, frequency: monthly, publication_lag_days: 7, direction: -1}
      - {id: "FRED:PAYEMS", provider: fred, frequency: monthly, publication_lag_days: 7, direction: 1}
      - {id: "FRED:ICSA", provider: fred, frequency: weekly, publication_lag_days: 5, direction: -1}
      - {id: "BLS:CES0500000003", provider: bls, frequency: monthly, publication_lag_days: 7, direction: 1}

  risk_appetite:
    weight: 1.0
    series:
      - {id: "FRED:VIXCLS", provider: fred, frequency: daily, publication_lag_days: 1, direction: -1}
      - {id: "FRED:STLFSI4", provider: fred, frequency: weekly, publication_lag_days: 7, direction: -1}
      # HY - IG spread differential; derived from the credit series above.
      - {id: "DERIVED:HY_IG_DIFFERENTIAL", provider: derived, frequency: daily, publication_lag_days: 1, direction: -1}

  sentiment:
    weight: 1.0
    series:
      - {id: "FRED:UMCSENT", provider: fred, frequency: monthly, publication_lag_days: 14, direction: 1}

  # Every factor score is on one axis: 100 = maximally risk-supportive. The two
  # below therefore read "high score = low real rates" and "high score = weak
  # dollar"; `direction` is what orients each series onto that axis. Consumers
  # wanting the level itself read FactorState.components, which carries it.
  real_rate:
    weight: 1.0
    series:
      # 10y real rate = nominal - breakeven. Encoded as its two legs with
      # opposing directions rather than as a DERIVED series, so the same scoring
      # pipeline handles it and no series needs computing before ingestion.
      - {id: "FRED:DGS10", provider: fred, frequency: daily, publication_lag_days: 1, direction: -1}
      - {id: "FRED:T10YIE", provider: fred, frequency: daily, publication_lag_days: 1, direction: 1}

  usd_strength:
    weight: 1.0
    series:
      # Broad nominal trade-weighted dollar. A stronger dollar tightens global
      # financial conditions, hence direction -1 on the supportive axis.
      - {id: "FRED:DTWEXBGS", provider: fred, frequency: daily, publication_lag_days: 1, direction: -1}

  # P5. The QUANTITY of money — deliberately not the `liquidity` factor above.
  #
  # `liquidity` mixes M2 and the Fed's balance sheet with NFCI and overnight RRP
  # take-up, which makes it a financial-CONDITIONS read: a score that falls when
  # conditions tighten, whatever the stock of money is doing. That is the right
  # composite for most consumers and the wrong regressor for FinCrypto, whose
  # liquidity beta is published as a coefficient with units. A beta on a series
  # that is half money stock and half conditions index is a number nobody can
  # state the meaning of.
  #
  # Both legs are already ingested for `liquidity`; every loader de-duplicates by
  # series id, so naming them again costs no fetch and no row. What this block
  # adds is a second, narrower reading of them.
  global_liquidity:
    weight: 1.0
    series:
      # US M2, the broad money stock. More money is risk-supportive: direction +1.
      #
      # `start` is each series' OWN first observation, so both fetch exactly what
      # they fetched before — these lines document a boundary rather than move
      # one. That is deliberate and load-bearing: this is a Layer 0 shared factor
      # scored on an expanding percentile, so truncating either leg to match the
      # crypto engine's 2010 price window would silently restate every historical
      # score of a factor that belongs to no engine. The macro history stays
      # long; the *price* is what starts in 2010.
      - {id: "FRED:M2SL",  provider: fred, frequency: monthly, publication_lag_days: 14, direction: 1, start: "1959-01-01"}
      # Total Fed assets. Weekly, and the faster-moving of the two — QE and QT
      # show up here months before they reach M2.
      - {id: "FRED:WALCL", provider: fred, frequency: weekly,  publication_lag_days: 7,  direction: 1, start: "2002-12-18"}

# ---------------------------------------------------------------------------
# Engine-private series. Nothing here is shared: another engine that needs one
# of these promotes it into `factors` rather than reaching across the boundary.
# ---------------------------------------------------------------------------
engines:
  money:
    # The numeraire's inputs. Roles are semantic — engines/money reads
    # `short_rate_primary`, not a hard-coded series id — so re-pointing the short
    # rate at a different series is a yaml edit.
    #
    # DGS3MO and RRPONTSYD are already ingested (by the rates engine and the
    # liquidity factor respectively). Naming them again here costs nothing: every
    # loader de-duplicates by series id (`required_series_ids`, `resolve_specs`,
    # `configured_series` are all set-based), so the rows are fetched once and
    # stored once. What this block declares is *which role each id plays for this
    # engine*, which is not derivable from the fact that someone else wants it.
    series:
      # SOFR from 2018-04-03; the fallback carries the path before that.
      short_rate_primary:  {id: "FRED:SOFR",      provider: fred, frequency: daily, publication_lag_days: 1}
      # 3m bill, secondary market, DISCOUNT basis — converted to an investment
      # yield in account.py before it enters the accrual (see its docstring).
      short_rate_fallback: {id: "FRED:DTB3",      provider: fred, frequency: daily, publication_lag_days: 1}
      # Constant-maturity 3m bill: already an investment yield, so this is the leg
      # that is directly comparable with SOFR in the bill-SOFR spread.
      bill_3m:             {id: "FRED:DGS3MO",    provider: fred, frequency: daily, publication_lag_days: 1}
      # Overnight reverse repo take-up, in $bn — the drainable liquidity buffer.
      rrp_volume:          {id: "FRED:RRPONTSYD", provider: fred, frequency: daily, publication_lag_days: 1}

      # FinRates' fitted curve, read back as data rather than imported as code
      # (§3 rule 2). The `engine_output` provider fetches these from the serving
      # plane's own /assets/rates/history endpoint, so they arrive through
      # pit_join like any other observation and carry a real release date. Absent
      # them — first run ever, or the API unreachable — money still publishes and
      # discounts long horizons off the flat short rate instead.
      ns_level:     {id: "ENGINE:rates.ns_level",     provider: engine_output, frequency: daily, publication_lag_days: 0}
      ns_slope:     {id: "ENGINE:rates.ns_slope",     provider: engine_output, frequency: daily, publication_lag_days: 0}
      ns_curvature: {id: "ENGINE:rates.ns_curvature", provider: engine_output, frequency: daily, publication_lag_days: 0}
      # The frozen shape parameter. Without it the published betas cannot be
      # turned back into a curve, so it is published per date and read per date.
      ns_lambda:    {id: "ENGINE:rates.ns_lambda",    provider: engine_output, frequency: daily, publication_lag_days: 0}

  rates:
    # The observable US Treasury constant-maturity curve. Every tenor is its own
    # series; which of them exist on a given day varies (holidays, and DGS1MO
    # only starts in 2001), so curve.py fits whatever is present rather than
    # requiring the full set. The tenor each id represents, in years, is in
    # config/engines/rates.yaml — this file stays a pure series map.
    series:
      dgs1mo:  {id: "FRED:DGS1MO", provider: fred, frequency: daily, publication_lag_days: 1}
      dgs3mo:  {id: "FRED:DGS3MO", provider: fred, frequency: daily, publication_lag_days: 1}
      dgs6mo:  {id: "FRED:DGS6MO", provider: fred, frequency: daily, publication_lag_days: 1}
      dgs1:    {id: "FRED:DGS1",   provider: fred, frequency: daily, publication_lag_days: 1}
      dgs2:    {id: "FRED:DGS2",   provider: fred, frequency: daily, publication_lag_days: 1}
      dgs3:    {id: "FRED:DGS3",   provider: fred, frequency: daily, publication_lag_days: 1}
      dgs5:    {id: "FRED:DGS5",   provider: fred, frequency: daily, publication_lag_days: 1}
      dgs7:    {id: "FRED:DGS7",   provider: fred, frequency: daily, publication_lag_days: 1}
      dgs10:   {id: "FRED:DGS10",  provider: fred, frequency: daily, publication_lag_days: 1}
      dgs20:   {id: "FRED:DGS20",  provider: fred, frequency: daily, publication_lag_days: 1}
      dgs30:   {id: "FRED:DGS30",  provider: fred, frequency: daily, publication_lag_days: 1}
      # 10y breakeven inflation — not a curve point; used for the real-rate read.
      breakeven10: {id: "FRED:T10YIE", provider: fred, frequency: daily, publication_lag_days: 1}

  equity:
    # The S&P500 price backbone — FinEquity's private input (FINDYN_V1_SPEC.md).
    # Sources verified live 2026-07-31; every provider named here has a working
    # adapter (an unimplemented one now fails config load, not the first fetch).
    series:
      # Daily backbone, and the vendor of record for every date it covers. FRED's
      # SP500 is license-limited to a rolling ~10y window (2016-08 onward) and
      # exists in FRED only, not ALFRED — the adapter detects that and fetches
      # without a real-time window; release dates come from this lag via the
      # vintage repair (data/vintages.py).
      #
      # The cap no longer bounds the published record: `backfill` below is the
      # same index and is spliced in front of this one for the dates it cannot
      # reach (engines/equity/prices.py::publication_path). This series still
      # owns every date from 2016-08 on.
      primary:      {id: "FRED:SP500", provider: fred, frequency: daily, publication_lag_days: 1}
      # Long daily proxy for regime/crisis calibration: NASDAQ100 runs from 1986
      # (verified: 11,994 obs), so 1987, 2000, 2008 and 2020 are all in-sample —
      # which the 10y SP500 window alone cannot offer.
      regime_proxy: {id: "FRED:NASDAQ100", provider: fred, frequency: daily, publication_lag_days: 1}
      # Daily S&P history back to 1927 — the same index as `primary`, so a model
      # fitted here is not fitted on a proxy (engines/equity/prices.py treats
      # this role as same-index for exactly that reason). That same-index claim
      # is also what licenses splicing it in front of `primary` to give the
      # published kinematics a century instead of a decade; the splice is
      # verified against the ten years the two records share before it is made.
      #
      # Yahoo rather than Stooq: Stooq is the natural choice and was configured
      # here first, but it fronts its CSV with a JavaScript proof-of-work
      # challenge that blocks a developer network and GitHub's runners alike,
      # and its per-IP daily cap denies the browser download too. Yahoo is a
      # fallback by the spec's reckoning (§5.1 source 7) and unversioned, so
      # treat a schema change as expected; absent it, `regime_proxy` carries
      # calibration and the engine says so rather than implying the S&P.
      backfill:     {id: "YAHOO:^GSPC", provider: yahoo, frequency: daily, publication_lag_days: 0}
      # Deep monthly history, 1871+. Nominal, matching the daily closes above;
      # SHILLER:REAL_PRICE exists for consumers that want the deflated series.
      deep_history: {id: "SHILLER:NOMINAL_PRICE", provider: shiller, frequency: monthly, publication_lag_days: 30}

      # --- M4 inputs -------------------------------------------------------
      # The RII composite (§3.2) and the transmission factor (§4) read these.
      # Every one is already ingested for a shared factor; naming them here
      # declares the ROLE each plays for this engine, which is not derivable
      # from the fact that the credit factor also wants the same series. Loaders
      # de-duplicate by id, so they are fetched and stored once.
      credit_spread:    {id: "FRED:BAMLH0A0HYM2", provider: fred, frequency: daily, publication_lag_days: 1}
      liquidity_stress: {id: "FRED:NFCI",         provider: fred, frequency: weekly, publication_lag_days: 7}
      # Bonds enter the stock-bond correlation as a YIELD; rii.py converts to a
      # return proxy by negating the change, which is the sign that would be
      # invisible if it were wrong.
      bond_yield:       {id: "FRED:DGS10",        provider: fred, frequency: daily, publication_lag_days: 1}
      # The curve state, for the transmission channel (§4).
      curve_slope:      {id: "FRED:T10Y3M",       provider: fred, frequency: daily, publication_lag_days: 1}

      # The numeraire, read back as data rather than imported (§C, 03-contracts
      # §4b). FinMoney publishes it; FinEquity discounts against it and never
      # learns that FinMoney exists.
      risk_free:        {id: "ENGINE:money.short_rate", provider: engine_output, frequency: daily, publication_lag_days: 0}

  gold:
    # FinGold's inputs (Phase 4). Gold has no cash flow, so there is no
    # valuation series here and never will be — the engine models *drivers*.
    series:
      # LBMA London PM fix, USD/oz. Daily from 1968-04-01, one day of lag. The PM
      # fix rather than AM: it is the benchmark most contracts settle against, and
      # mixing the two would put a several-hour timing break in the middle of a
      # single series.
      #
      # Read from LBMA rather than FRED, and not by preference. This role was
      # declared as FRED:GOLDPMGBD228NLBM; FRED has since delisted the whole ICE
      # Benchmark Administration set, and both GOLDPMGBD228NLBM and
      # GOLDAMGBD228NLBM now answer `400 The series does not exist` (verified
      # 2026-08-01 with a working key). LBMA publishes the same benchmark itself,
      # with more history than FRED ever carried — see data/providers/lbma.py.
      price: {id: "LBMA:GOLD_PM", provider: lbma, frequency: daily, publication_lag_days: 1}

      # The driver panel (P4 §2). Every one of these is already ingested for a
      # shared factor or another engine; naming them here declares the ROLE each
      # plays for gold, which is not derivable from the fact that someone else
      # wants the same id. Loaders de-duplicate by id.
      #
      # Real rate: the carry cost of holding a non-yielding asset. Nominal 10y
      # minus breakeven, both as levels — drivers.py takes the 12m change too.
      nominal_10y:  {id: "FRED:DGS10",     provider: fred, frequency: daily, publication_lag_days: 1}
      breakeven_10y: {id: "FRED:T10YIE",   provider: fred, frequency: daily, publication_lag_days: 1}
      # The breakeven starts in 2003, and a driver that starts in 2003 makes the
      # 1980 and 1987 gold regimes unfittable — which is most of the history that
      # would tell a crisis bid apart from a rate headwind. Before TIPS existed,
      # drivers.py falls back to an EX-POST real rate: nominal 10y minus trailing
      # 12m CPI inflation. A different quantity from a breakeven-implied ex-ante
      # rate, so the splice is recorded per date rather than blended silently.
      cpi:          {id: "FRED:CPIAUCSL",  provider: fred, frequency: monthly, publication_lag_days: 14}
      # Broad trade-weighted dollar. Gold is priced in USD, so dollar strength is
      # a mechanical headwind before any behavioural story about it.
      usd_index:    {id: "FRED:DTWEXBGS",  provider: fred, frequency: daily, publication_lag_days: 1}
      # The broad index only starts in 2006. The major-currencies index runs from
      # 1973 and was discontinued in 2019, so the two together cover the whole
      # record with a five-year overlap. They are different indices at different
      # levels and are NEVER spliced as levels — drivers.py splices the 12-month
      # log CHANGE, which is the only thing the driver reads and the only thing
      # the two indices agree about.
      usd_index_legacy: {id: "FRED:DTWEXM", provider: fred, frequency: daily, publication_lag_days: 1}
      # Financial conditions, for the stress driver. Weekly, and carrying the
      # limitation in open issue 13: fetched without vintages because the vintage
      # path truncates the series, so this reads today's values at historical
      # dates. Recorded rather than hidden.
      liquidity_stress: {id: "FRED:NFCI",  provider: fred, frequency: weekly, publication_lag_days: 7}

      # The equity leg of the hedge score. hedge.py asks a conditional question —
      # how does gold move on the days equities are IN A DRAWDOWN — so it needs
      # the index itself, not a summary of it. NASDAQ100 rather than SP500 because
      # FRED licence-caps SP500 to a rolling ten years, which does not reach 2008
      # or 2011; this one starts in 1986 and covers every stress window the
      # backtest asserts on. It is a proxy for "equities", and the engine says so.
      equity_proxy:  {id: "FRED:NASDAQ100", provider: fred, frequency: daily, publication_lag_days: 1}

      # FinEquity's instability index, read back as DATA (§3 rule 2). This is the
      # crisis-premium input, and routing it through the engine_output provider
      # rather than the equity engine is the whole point: gold learns what the
      # equity RII *is* without learning that FinEquity *exists*, and
      # `lint-imports` enforces that it stays that way.
      equity_rii:   {id: "ENGINE:equity.rii", provider: engine_output, frequency: daily, publication_lag_days: 0}

  crypto:
    # FinCrypto's inputs (Phase 5) — EXPERIMENTAL, and the engine ships disabled.
    #
    # Bitcoin has no exchange calendar: every series whose spine is the price has
    # an observation on weekends and holidays too, which is why this engine
    # annualizes on 365 rather than 252. A 252 here would misreport every
    # volatility and every jump intensity by 20% in the safe-looking direction.
    series:
      # The price. Stooq per the phase brief, at lag 0: a daily close is public
      # the session it prints, and there is no fixing or settlement to wait for.
      #
      # Operational note, and it is the same one the equity engine's `backfill`
      # role carries: stooq.com fronts its CSV with a JavaScript proof-of-work
      # interstitial that blocks this project's egress and GitHub's runners alike
      # (re-verified for this symbol 2026-08-05). The adapter is complete and
      # tested, and `jobs.backfill --from-file` still reaches it from a browser
      # download — but a nightly run cannot. Hence the fallback below.
      price:          {id: "STOOQ:BTCUSD",  provider: stooq, frequency: daily, publication_lag_days: 0, start: "2010-07-18"}
      # Same instrument, keyless, reachable. Yahoo is a fallback by the spec's
      # reckoning (§5.1 source 7) and unversioned, so treat a schema change as
      # expected; absent both, the engine publishes nothing and says why.
      #
      # `start` is Yahoo's own first bar. Asking earlier does not fail, it just
      # returns nothing — and the request is what costs on a throttled endpoint.
      price_fallback: {id: "YAHOO:BTC-USD", provider: yahoo, frequency: daily, publication_lag_days: 0, start: "2014-09-17"}
      # The deep history, and the reason this block changed. Both closes above
      # begin in 2014 at the earliest, which cuts 2011 and 2013 out of a sample
      # that has six cycles in it — so half the cycles were missing from a model
      # whose confidence ceiling is already justified by how few there are.
      #
      # This is a volume-weighted daily AVERAGE across exchanges, not a close.
      # engines/crypto/prices.py splices it in front of the closes only after
      # checking the three things that decide whether that is honest (no step at
      # the seam, no level bias, comparable volatility) and flags every date it
      # supplied. Read that module before changing this line.
      #
      # `start` is the first date bitcoin had a market price at all. The chart is
      # padded with 0.0 back to the genesis block; the adapter drops those,
      # because "no market yet" is not a price of zero.
      price_history:  {id: "BLOCKCHAIN:MARKET_PRICE", provider: blockchain, frequency: daily, publication_lag_days: 1, start: "2010-08-18"}

      # The macro leg. Same two series as the `global_liquidity` factor, declared
      # here as roles because the engine regresses on the LEVEL CHANGE and the
      # factor publishes a 0-100 percentile — a regression of returns on a
      # percentile has a slope, but not one anybody can put units on. The factor
      # score is published beside the beta as a cross-check, never as its input;
      # this is the same split gold makes between its drivers and Layer 0.
      m2:             {id: "FRED:M2SL",  provider: fred, frequency: monthly, publication_lag_days: 14}
      central_bank_assets: {id: "FRED:WALCL", provider: fred, frequency: weekly, publication_lag_days: 7}

      # --- On-chain -------------------------------------------------------
      # Keyless, from blockchain.info (data/providers/blockchain.py). A daily
      # chart point covers a UTC day and is complete only once that day ends, so
      # the lag is 1 — asserted by the adapter as well, because the reason is
      # structural rather than a publisher's schedule.
      #
      # `tx_volume_usd` is the volume leg of the speculation index. USD rather
      # than BTC deliberately: constant BTC volume at ten times the price is ten
      # times the speculation, and a BTC-denominated series cannot say so.
      tx_volume_usd:  {id: "BLOCKCHAIN:TX_VOLUME_USD",     provider: blockchain, frequency: daily, publication_lag_days: 1}
      # Network usage, independent of price entirely — the honest adoption read.
      active_addresses: {id: "BLOCKCHAIN:N_UNIQUE_ADDRESSES", provider: blockchain, frequency: daily, publication_lag_days: 1}
      transactions:   {id: "BLOCKCHAIN:N_TRANSACTIONS",    provider: blockchain, frequency: daily, publication_lag_days: 1}
      # Security spend: the one on-chain series with a real cost floor behind it.
      hash_rate:      {id: "BLOCKCHAIN:HASH_RATE",         provider: blockchain, frequency: daily, publication_lag_days: 1}
      #
      # NOT DECLARED, and deliberately: MVRV, SOPR, realized cap and
      # coin-days-destroyed. They are the metrics this model would most like to
      # have and every one of them is a Glassnode / Coin Metrics product behind a
      # paid key. Declaring an id against a provider with no adapter would defer
      # the failure from config load to the first fetch, which is exactly what
      # core/config.py::VALID_PROVIDERS exists to prevent. The TODO naming what
      # adding one costs is in data/providers/registry.py, beside the table it
      # would have to be added to. Every on-chain role above is optional to the
      # engine, so the ones that do exist already degrade correctly without them.

# Cached in KV with a short TTL for the dashboard's live tiles (§6).
realtime_cache:
  ttl_seconds: 900
  series: ["FRED:VIXCLS", "FRED:DGS10", "FRED:SP500"]
