# KK-Ω — latent market-state research module. EXPERIMENTAL, RESEARCH ONLY.
#
# Disabled by default and quarantined by import-linter: no production path can
# reach this module even if this flag is flipped. See
# docs/research/kk-omega-design.md.
enabled: false
experimental: true

# Stamped onto every OmegaSpec. Bump it when a *definition* changes — a window,
# a column set, the sign-pinning precedence — because a stored artifact is only
# reproducible against the version that produced it. Recalibrating a threshold
# inside an existing definition is not a version change; changing what Ω means
# is.
model_version: "omega-0.1.0"

# --- The series Ω is built from -------------------------------------------
#
# Every id here is already declared in config/series.yaml. Adding a data
# dependency is out of scope for this track (docs/research/kk-omega-design.md
# §3); a role left blank simply drops the columns built from it, by the same
# path a provider outage would take.
#
# The price is YAHOO:^GSPC rather than the engine's spliced publication path.
# The splice exists so that FRED stays vendor-of-record for every date it
# covers, which is a *publication* concern — this module publishes nothing, and
# ^GSPC is the one record in the fixture that runs 1927-12-30 → 2026-07-30
# without a join in the middle. A join in the middle of a research window is a
# structural break the PCA would happily fit.
series:
  price:                "YAHOO:^GSPC"
  dispersion_reference: "FRED:NASDAQ100"
  rate_level:           "FRED:DGS10"
  curve_slope:          "FRED:T10Y3M"
  liquidity:            "FRED:NFCI"
  # Thin: 2023-08-01 onward in the committed fixture, 787 observations against
  # 6,649 for the rates columns. It is configured anyway, and the availability
  # check below is what stops it deciding the start of the research window.
  credit_spread:        "FRED:BAMLH0A0HYM2"

features:
  # The primary research window. 2000-01 is where the rates, curve and
  # liquidity columns all begin in the fixture, so it is the widest span on
  # which the full block is defined. Warm-up is computed from data *before*
  # this date and then discarded, so no rolling window is short at the start.
  #
  # A wider window is a DIFFERENT SPECIFICATION, not a longer run of this one:
  # back past 2000 only the four price-derived columns exist, which is what
  # PriceOnlyOmegaEstimator is for, and it is reported as its own row.
  start: "2000-01-01"

  # Cadence of the price series, for every months→observations conversion
  # below. Quoted as a frequency rather than as 252 so the number and the
  # reason for it stay together (engines/equity/prices.py::PERIODS_PER_YEAR).
  frequency: daily

  # Which candidates to build. The full vocabulary is
  # research/omega/domain.py::FEATURE_COLUMNS; naming a subset here is how a
  # sensitivity run drops a column without editing Python.
  columns:
    - realized_vol
    - vol_of_vol
    - abs_return
    - drawdown
    - dispersion
    - rate_level_chg
    - curve_slope
    - liquidity_stress
    - credit_velocity

  # One month of realized volatility — the conventional choice for a daily
  # series, and short enough to move inside an episode rather than after it.
  # The same default regime/design.py uses, and the same function computes it.
  realized_vol_months: 1.0
  # Three months of that series' own standard deviation. §3.2 asks for "63d
  # window of 21d RV"; this is the outer window, via rii.py::vol_of_vol.
  vol_of_vol_months: 3.0
  # EWMA span for |log return|. One month, so the smoothed absolute return and
  # the realized volatility describe the same stretch of tape by two routes —
  # one an L1 measure, one an L2 one, and the gap between them is informative
  # about tail shape in a way either alone is not.
  abs_return_months: 1.0
  # Rolling correlation window against the dispersion reference. Three months:
  # one month of daily returns gives a correlation with a standard error near
  # 0.2, which is noise, and a year cannot move inside a crisis.
  dispersion_months: 3.0
  # ...then differenced over one month. The LEVEL of the S&P/NASDAQ correlation
  # is near-constant across decades; its movement is not.
  dispersion_change_months: 1.0
  # Yield and spread changes over one month. Long enough to clear the daily
  # noise, short enough that a credit repricing is still inside the window.
  rate_change_months: 1.0
  credit_change_months: 1.0

  # How long a released value may stand in for the current one. 21 calendar
  # days because FRED:NFCI is weekly with a 13-day median publication lag in
  # the fixture, so a fill shorter than ~20 days would blank the liquidity
  # column on most dates. Longer than this is not a stale reading, it is a
  # series that stopped publishing, and it must stop contributing.
  max_staleness_days: 21

  # The availability check (docs/research/kk-omega-design.md §3.1). BOTH apply.
  # The absolute floor rejects a column that is short in any terms; the
  # coverage fraction rejects one that is long enough on its own and still
  # describes only a corner of the window. The HY OAS clears the first at 787
  # rows and fails the second at 12% of the 2000-2026 window, which is the
  # whole reason the second exists.
  min_column_observations: 252
  min_column_coverage: 0.60

estimator:
  # "pca" (the MVP, all surviving columns) or "pca_price_only" (the 1927
  # specification, price-derived columns only). The HMM estimator is the
  # planned second specification and is deliberately not built yet: a second
  # estimator without a first out-of-sample result is speculation
  # (docs/research/kk-omega-design.md §4).
  name: pca

  # THE SIGN-PINNING PRECEDENCE (design note §5). The loading on the first
  # SURVIVING column in this list is forced non-negative; if it is negative the
  # whole loading vector is negated, and the column used is recorded in
  # OmegaSpec.sign_reference.
  #
  # This is an ordered list and not "the column with the largest absolute
  # loading" on purpose. That alternative is itself unstable: two columns with
  # near-equal loadings would hand the reference back and forth between
  # walk-forward windows and reintroduce the sign flip through a side door —
  # and a sign flip does not fail, it produces a Ω̇ spike train aligned to the
  # refit calendar that reads exactly like a signal.
  #
  # realized_vol leads because it is the one column present in every
  # specification including the price-only one, so the orientation of Ω means
  # the same thing across all of them: Ω increases with market stress. That is
  # a convention, not a finding, and the report says so wherever Ω's sign is
  # interpreted.
  sign_reference_precedence:
    - realized_vol
    - vol_of_vol
    - abs_return
    - drawdown
    - credit_velocity
    - liquidity_stress
    - dispersion
    - rate_level_chg
    - curve_slope

  # Two years of daily observations — the floor kalman.py uses to identify
  # three variances, reused here for the same reason: below it, a covariance
  # matrix over nine columns is estimated from too little to be a projection.
  # Under this the estimator RAISES rather than returning a short Ω.
  min_fit_observations: 504

dynamics:
  # Ω goes through the same local-linear-trend filter price goes through, so it
  # inherits the same start-up problem and the same remedy. kinematics.py
  # measured the untreated version on the century price path: the first
  # published velocity was +142% annualized, and because the z-baseline is
  # expanding, the transient widens it for every later date and never washes
  # out. One year, expressed in years so the same number means 252 observations
  # here and 12 on a monthly path.
  kalman_burn_in_years: 1.0
  # Reached-rather-than-converged is logged, not raised — a filtered path from
  # slightly-off variances is far more useful than no state (kalman.py).
  kalman_maxiter: 200
  # Trailing standard deviation of Ω̇. Three months: the same span vol_of_vol
  # uses, so "how fast is Ω moving" and "how unstable is the market" are
  # measured over comparable stretches.
  volatility_months: 3.0
  # Expanding z-score baseline for Ω, minimum ten years — §8.3's rule for
  # jerk_z, and the same function computes it. Degrades and reports itself on a
  # shorter path rather than publishing a column of NaN.
  zscore_min_years: 10.0

regime:
  # Bands on Ω's EXPANDING percentile (0-100), via the shared causal scorer
  # factors/compute.py::score_series. Not a second regime model: three names
  # over one continuous variable, with no transition matrix and no posterior.
  #
  # 60/85 rather than terciles. The distribution of a stress coordinate is not
  # symmetric — most days are calm — so equal thirds would label a third of an
  # ordinary decade "stress" and the word would stop meaning anything.
  #
  # Measured on the shipped configuration over 2000-2026, these put 68.5% of
  # scored dates in latent_calm, 22.1% in latent_transition and 9.4% in
  # latent_stress — about one day in eleven, and 2008-09 through 2008-12 and
  # 2020-03 through 2020-04 are each over 80% latent_stress while 2017 is under
  # 5%. That is an in-sample reading of a whole-record fit and so a sanity
  # check, not a result; KK3 is what measures whether the banding predicts
  # anything.
  transition_percentile: 60.0
  stress_percentile: 85.0

coupling:
  # Which estimator KK3 treats as C. The regression is the one the report will
  # quote: it is the only one of the three that comes with a standard error,
  # and a beta with no standard error is not a finding.
  primary: regression
  # Which regression specification C is read off. Both are fitted and both are
  # reported; this only chooses which one is published as the coupling.
  #   velocity:     v_t = b0 + b1*Wdot_t + b2*W_t + e
  #   acceleration: a_t = b0 + b1*Wdot_t + b2*Wddot_t + b3*W_t + e
  specification: velocity

  # --- The ratio estimator's safeguards --------------------------------------
  #
  # dOmega passes through zero constantly, so the denominator carries a floor.
  # A PERCENTILE of |dOmega| over the expanding history, not a constant: Omega's
  # scale depends on which columns survived the availability check and on the
  # window the projection was fitted over, so a constant would mean a different
  # thing in every walk-forward window.
  #
  # At the 25th percentile roughly a quarter of observations are undefined BY
  # CONSTRUCTION. That is the design, not a failure — below the floor the
  # estimator emits NaN and never 0, because zero is a claim about the coupling
  # and absence is not one.
  denominator_percentile: 25.0

  # Expanding winsorization bounds, in percent. THIS CAN DESTROY THE SIGNAL IT
  # IS PROTECTING: if the coupling's information lives in its extremes — which
  # is exactly what a regime-transition story would predict — clipping removes
  # it. There is no way to have both, so the winsorized share is published
  # beside the series and KK5 is required to show the sensitivity.
  winsor_lower: 1.0
  winsor_upper: 99.0

  # Above this share of undefined observations the ratio estimator declines
  # rather than publishing a mostly-NaN column. Set well above the 25% the
  # floor produces by design: this ceiling is about pathology — an Omega that
  # barely moves at all — not about the floor.
  max_undefined_share: 0.50

  # --- The regression estimator ----------------------------------------------
  #
  # Two years of daily observations before any coefficient is published, the
  # same floor kalman.py uses to identify three variances and the estimator
  # uses to fit a projection. Below it the coefficients exist and mean nothing.
  min_observations: 504

  # Newey-West lag. Absent means the floor(4*(n/100)^0.25) rule, which is 11 at
  # the full 6,600-observation window and 5 at the 504 floor. Both regressors
  # are persistent and plain OLS standard errors on persistent regressors are
  # optimistic by a factor of several, so an OLS t-stat here would not be a
  # weaker answer, it would be the wrong one.
  # newey_west_lag: 11

  # Observations between Newey-West evaluations. An exact daily path is O(n^2)
  # in the sample length, because the residuals are refitted at every date, and
  # the quantity moves on the scale of months. 21 is one trading month; the
  # last date is always evaluated because that is the one the report quotes.
  # Between evaluations the t-stat is NaN and is NOT forward-filled — a chart of
  # a forward-filled significance reading implies a test was run on a day it
  # was not.
  tstat_cadence: 21

  # Reciprocal-condition ceiling on the Gram matrix. Omega and Omega-dot are
  # strongly related early in a window, and a solve through a badly conditioned
  # matrix does not raise — it returns enormous coefficients that look like a
  # finding. Rows above this are masked out instead.
  max_condition: 1.0e10

  # Baseline for the interaction control's expanding z-scores. Ten years, the
  # same rule jerk_z is held to.
  zscore_min_years: 10.0

curvature:
  # "equal" or "fitted". THERE IS NO THIRD MODE, and adding one is a lookahead
  # decision rather than a configuration one.
  #
  # equal:  w_i = 1/5. A real choice, not a placeholder, for the reason
  #         rii.py::DEFAULT_WEIGHTS gives — nothing in the record justifies
  #         asserting that one instability term leads another by a factor of
  #         1.4, and a weight vector fitted on eight episodes is fitted on eight
  #         observations.
  # fitted: the magnitudes of PC1 over the FIRST fit_observations complete rows
  #         only, frozen for the whole path thereafter. Unsupervised, so there
  #         is no target to leak.
  weights: equal

  # Complete rows the fitted mode estimates over, counted from the START of the
  # sample. The first N rows and not a fraction of it, precisely so that
  # appending later data cannot move the window — which is the property the KK2
  # test asserts. 1260 is five years of daily observations.
  fit_observations: 1260

  # Expanding z-score baseline for every term, in years. Ten, the same rule
  # jerk_z is held to, computed by the same function.
  zscore_min_years: 10.0

  # A term with fewer scored rows than this is dropped and NAMED, never
  # zero-filled: zero on an instability axis means "maximally stable", which is
  # a much stronger claim than "we could not measure it" (rii.py's rule).
  min_term_observations: 252

  # Share of the total weight that must be present on a date for K to be
  # published there. THIS IS A DELIBERATE DEPARTURE FROM rii.py, which
  # renormalizes per date with no floor because its seven components warm up
  # within months of each other. K's do not: the price terms come off a record
  # starting 1927 and the Omega terms off one starting 2000, so with no floor
  # the largest reading in the whole series is 1987-10-19 — computed from
  # `acceleration` and `jerk` alone, with nothing in the output saying so.
  #
  # The cost is real and belongs in the report: every term is scored against a
  # ten-year expanding baseline, so on a 2000-start Omega the composite does
  # not begin until roughly 2010 and 2008 IS OUTSIDE IT. Shortening
  # zscore_min_years reaches further back on a noisier scale; that is a KK5
  # sensitivity, not a default.
  min_coverage: 0.999

walk_forward:
  # Rebalance cadence in months. The Omega spec is refit at each one and applied
  # forward only, so this is also the length of every out-of-sample block.
  cadence_months: 1

  # Warm-up, discarded ENTIRELY rather than run on a short window: an Omega
  # fitted on 200 observations is a statement about its own start-up, exactly as
  # kalman_burn_in_years is for velocity. Five years from the first date of the
  # research window.
  min_train_years: 5.0

  # Forecast horizons in trading days: one day, one week, one month, one
  # quarter. Every question is answered at all four, and the multiplicity
  # adjustment is taken over the whole family.
  horizons: [1, 5, 21, 63]

  # Ridge strengths searched on an inner EXPANDING split of the first training
  # window, then frozen. Expanding and not k-fold: a random fold would train on
  # data after the rows it scores, which is the leak this module exists to
  # avoid, hidden inside the model selection where it is least visible.
  ridge_alphas: [0.1, 1.0, 10.0, 100.0, 1000.0]
  logistic_c: [0.01, 0.1, 1.0]
  inner_splits: 3

  # Transaction cost per unit turnover, in basis points. Reported alongside the
  # BREAK-EVEN cost at which each arm's edge disappears — an edge that dies at
  # 3 bps is a finding, not a footnote.
  cost_bps: 5.0

  # Seed for the shuffled-target control. Fixed so the control is reproducible;
  # if any arm shows skill against these permuted targets the harness is leaking
  # and every other number in KK3 is void.
  shuffle_seed: 20260904
  auc_ceiling: 0.55

  # The window-boundary test: no refit may move Omega by more than this many of
  # its own trailing standard deviations. Catches a sign flip or a scaler reset
  # at the harness level, which the KK1 two-window unit test cannot see.
  boundary_jump_sigma: 8.0
  boundary_window: 63

  # Non-overlapping sub-periods for the stability table. A result present in
  # exactly one of these is UNSTABLE, not SUPPORTED (design note section 9).
  sub_periods:
    - {name: "2005-2009", start: "2005-01-01", end: "2009-12-31"}
    - {name: "2010-2014", start: "2010-01-01", end: "2014-12-31"}
    - {name: "2015-2019", start: "2015-01-01", end: "2019-12-31"}
    - {name: "2020-2024", start: "2020-01-01", end: "2024-12-31"}
    - {name: "2025-",     start: "2025-01-01", end: "2100-12-31"}
