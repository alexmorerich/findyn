[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "findyn-compute"
version = "1.0.0"
description = "FinDyn v1.0 compute plane — features, state estimation, regime detection, Monte Carlo (FINDYN_V1_SPEC.md §6)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "hmmlearn>=0.3.2",
  "xgboost>=2.1",
  "scikit-learn>=1.5",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.8",
]

[project.scripts]
findyn-backfill = "jobs.backfill:main"
findyn-daily = "jobs.daily:main"
findyn-weekly = "jobs.weekly:main"
findyn-refit = "jobs.monthly_refit:main"

[tool.setuptools]
packages = ["findyn", "jobs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
