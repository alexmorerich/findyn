[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "findynamics"
version = "1.0.0"
description = "FinDynamics compute plane — world state, risk factors, asset physics engines, portfolio (docs/redesign/01-target-architecture.md)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "hmmlearn>=0.3.2",
  "xgboost>=2.1",
  # §14.3: every regime change ships its top feature contributions. SHAP is how
  # the L3 classifier's are produced, so it is a dependency of the explainability
  # contract rather than an optional analysis convenience.
  #
  # macOS note: the xgboost wheel needs an OpenMP runtime matching the
  # interpreter's architecture (`brew install libomp`, from the Homebrew whose
  # prefix matches `platform.machine()`). Linux CI has it already.
  "shap>=0.46",
  "scikit-learn>=1.5",
  # A fitted artifact is addressed by content, so the fit has to be reproducible
  # bit for bit; the HMM's k-means init is OpenMP-parallel and is not, at a fixed
  # seed, unless its thread pool is pinned (issue #6, engines/equity/regime/hmm.py).
  # Installed anyway as a scikit-learn dependency — named here because relying on
  # it transitively for a correctness property is how it disappears in a bump.
  "threadpoolctl>=3.1",
  "pyyaml>=6.0",
  "httpx>=0.27",
  # Shiller publishes ie_data.xls in the legacy .xls format, which openpyxl
  # cannot read; xlrd is the only maintained reader for it.
  "xlrd>=2.0.1",
]

[project.optional-dependencies]
# FinCrypto (P5). Deliberately empty, and kept rather than deleted.
#
# The engine's rule is that anything it needs beyond numpy/pandas belongs here
# and never in `dependencies` above — a research module quarantined by the import
# graph should not be able to put a package into every deployment of the compute
# plane. It currently needs nothing: the expanding OLS is five running sums, the
# Gumbel threshold is three logarithms, and the supply schedule is arithmetic on
# four dates, so scipy/statsmodels never come into it.
#
# The extra exists anyway so that the first dependency has an obvious home. An
# empty list here is a decision; no list at all is an invitation to add a
# `web3` to the core deps because there was nowhere else to put it.
crypto = []
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  # 2.0 introduced the `a | b` independent-sibling layer syntax used below.
  "import-linter>=2.0",
]

[project.scripts]
findynamics-backfill = "jobs.backfill:main"
findynamics-daily = "jobs.daily:main"
findynamics-weekly = "jobs.weekly:main"
findynamics-refit = "jobs.monthly_refit:main"

[tool.setuptools.packages.find]
include = ["findynamics*", "jobs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# Registered rather than ad-hoc, because --strict-markers is on and a typo in a
# marker name should fail the run instead of silently selecting nothing.
markers = [
    "slow: refits a model. Runs in CI like everything else; the marker exists so a developer iterating on one module can say `-m 'not slow'` and mean it.",
]
# Lets test modules share helpers via `from tests.conftest import ...`.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

# The layer rules of docs/redesign/01-target-architecture.md §3, enforced rather
# than documented. `lint-imports` runs beside ruff and pytest in CI.
[tool.importlinter]
root_package = "findynamics"

[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
layers = [
    "findynamics.portfolio",
    "findynamics.engines",
    "findynamics.factors | findynamics.data",
    "findynamics.core",
]

[[tool.importlinter.contracts]]
name = "Engines are independent"
type = "independence"
modules = [
    "findynamics.engines.money",
    "findynamics.engines.rates",
    "findynamics.engines.equity",
    "findynamics.engines.gold",
    "findynamics.engines.crypto",
]

# The independence contract above already covers this pair, but P2 makes money a
# real consumer of FinRates' output, so the specific direction gets its own named
# contract: a failure should say "money imported rates" rather than making someone
# work out which of five modules broke a generic independence rule. Money reads
# the fitted curve out of `engine_output` as data instead (see
# findynamics/data/providers/published.py).
[[tool.importlinter.contracts]]
name = "Money reads the rates curve as data, never as code"
type = "forbidden"
source_modules = ["findynamics.engines.money"]
forbidden_modules = ["findynamics.engines.rates"]

# P4 makes gold a consumer of FinEquity's instability index, so that direction
# gets its own named contract for the same reason money/rates did: a failure
# should say "gold imported equity" rather than making someone work out which of
# five modules broke a generic independence rule. Gold reads the RII out of
# `engine_output` as data instead (ENGINE:equity.rii, see
# findynamics/data/providers/published.py).
[[tool.importlinter.contracts]]
name = "Gold reads the equity instability index as data, never as code"
type = "forbidden"
source_modules = ["findynamics.engines.gold"]
forbidden_modules = ["findynamics.engines.equity"]

[[tool.importlinter.contracts]]
name = "Crypto is quarantined"
type = "forbidden"
source_modules = [
    "findynamics.portfolio",
    "findynamics.factors",
    "findynamics.core",
    "findynamics.data",
]
forbidden_modules = ["findynamics.engines.crypto"]
