name: Compute — daily

# Daily state run: build the WorldState, run every enabled engine, write back
# (docs/redesign/01-target-architecture.md §8).
#
# The schedule was parked until an engine existed — a cron running a
# not-implemented job every day is noise, not a heartbeat. P1 ships FinRates, so
# it now runs for real.
on:
  workflow_dispatch:
    inputs:
      as_of:
        description: "Information-set cutoff (YYYY-MM-DD). Blank = today, UTC."
        required: false
      dry_run:
        description: "Compute without writing back"
        type: boolean
        default: true
      full_history:
        description: >
          Republish every engine's per-date series from the start of its data
          instead of the nightly window. Run this once after a model version
          bump that changes historical values — FinEquity's is ~24,700 dates
          back to 1927-12-30, which the nightly five-year window never reaches.
          Never on the schedule: it would write a century every night to add
          one row.
        type: boolean
        default: false
  schedule:
    - cron: "0 3 * * 2-6"   # 03:00 UTC, after the previous session's close

jobs:
  daily:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compute
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: compute/pyproject.toml
      - run: pip install -e .
      - name: Run daily state computation
        env:
          FINDYN_ADMIN_URL: ${{ secrets.FINDYN_ADMIN_URL }}
          ADMIN_HMAC_SECRET: ${{ secrets.ADMIN_HMAC_SECRET }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
        run: |
          python -m jobs.daily \
            ${{ inputs.as_of && format('--as-of {0}', inputs.as_of) || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.full_history && '--full-history' || '' }}
