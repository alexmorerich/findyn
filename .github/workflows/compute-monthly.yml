name: Compute — monthly refit

# Expanding-window refit of every enabled engine (FINDYN_V1_SPEC.md §9,
# docs/redesign/01-target-architecture.md §8).
#
# Separate from the daily run because its output is a parameter set, not a
# state. For FinRates that parameter is the Nelson-Siegel lambda: chosen once
# over the grid and frozen, because a lambda that moved daily would silently
# rebase every factor history the engine has published.
on:
  workflow_dispatch:
    inputs:
      as_of:
        description: "Information-set cutoff (YYYY-MM-DD). Blank = today, UTC."
        required: false
      dry_run:
        description: "Report what would be refitted without writing parameters"
        type: boolean
        default: true
  schedule:
    - cron: "0 4 1 * *"   # 04:00 UTC on the first of the month

jobs:
  refit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: compute
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: compute/pyproject.toml
      - run: pip install -e .

      - name: Refit enabled engines
        env:
          FINDYN_ADMIN_URL: ${{ secrets.FINDYN_ADMIN_URL }}
          ADMIN_HMAC_SECRET: ${{ secrets.ADMIN_HMAC_SECRET }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
        run: |
          python -m jobs.monthly_refit \
            ${{ inputs.as_of && format('--as-of {0}', inputs.as_of) || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      # Read the fit back out of R2 and check it is usable.
      #
      # This replaces an `upload-artifact` step that claimed to publish the
      # fitted parameters and published nothing: a production refit sets both
      # admin secrets, so `build_artifact_store` returns the R2 store and
      # `compute/artifacts/` is never written. With `if-no-files-found: warn`
      # the step found an empty directory every month and passed. Measured on
      # the 2026-08-08 refit: zero artifacts uploaded, job green.
      #
      # A step that verifies nothing is worse than no step, because the job
      # looks like it checks its own output. This one reads each engine's
      # parameters back from wherever they were actually stored and fails if the
      # version, the fit date or the byte-stability guarantee is not what the
      # run just wrote.
      - name: Verify fitted parameters were stored
        if: ${{ !inputs.dry_run }}
        env:
          FINDYN_ADMIN_URL: ${{ secrets.FINDYN_ADMIN_URL }}
          ADMIN_HMAC_SECRET: ${{ secrets.ADMIN_HMAC_SECRET }}
        run: python -m jobs.verify_artifacts -v
